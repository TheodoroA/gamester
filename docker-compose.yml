version: '3.8'

services:
  gamester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamester-app
    restart: unless-stopped
    ports:
      # Ocupa apenas o loopback interno para consumo exclusivo pelo Nginx reverso
      - "127.0.0.1:3030:3030"
    environment:
      - NODE_ENV=production
      - PORT=3030
      - HOST=0.0.0.0
      - ADMIN_KEY=${ADMIN_KEY:-gamester-vps-secret}
      - DATABASE_PATH=/app/data/gamester.db
      - NODE_OPTIONS=--max-old-space-size=128
    volumes:
      - gamester-data:/app/data
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 150M
        reservations:
          memory: 64M
    # Limitação estrita no Docker engine (evita starvation do Foundry VTT e TeamSpeak)
    mem_limit: 150m
    memswap_limit: 200m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gamester-data:
    driver: local
